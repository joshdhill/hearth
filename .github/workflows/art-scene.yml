name: Art scene (fill, then upscale 4x)
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/art/scene/**', 'tools/art/fill_scene.py', '.github/workflows/art-scene.yml' ]
permissions:
  contents: write
jobs:
  scene:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [ 11, 23, 37 ]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gradio_client opencv-python-headless numpy
      - name: Fill
        run: python3 tools/art/fill_scene.py tools/art/scene/stage1.png tools/art/scene/stage1-mask.png /tmp/scene ${{ matrix.seed }}
      - name: Upscale 4x
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q spandrel pillow
          curl -sL -o RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          python3 tools/art/upscale.py /tmp/scene/filled.png /tmp/scene/filled-x4.png
          python3 -c "
          from PIL import Image
          Image.open('/tmp/scene/filled-x4.png').convert('RGB').save('/tmp/scene/filled-x4.jpg', quality=96, subsampling=0)"
          rm /tmp/scene/filled-x4.png
      - name: Save to the media-work branch
        if: always()
        run: |
          git config user.name "hearth-bot"; git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3 4 5 6; do
            rm -rf /tmp/mw; git fetch -q origin media-work && git worktree add -q -f /tmp/mw origin/media-work
            rm -rf /tmp/mw/scene/${{ matrix.seed }}; mkdir -p /tmp/mw/scene/${{ matrix.seed }} && cp /tmp/scene/* /tmp/mw/scene/${{ matrix.seed }}/
            (cd /tmp/mw && git add -A scene && git commit -qm "Scene fill, seed ${{ matrix.seed }}" && git push -q origin HEAD:media-work) && break
            git worktree remove -f /tmp/mw; sleep $((RANDOM % 15 + try * 5))
          done
