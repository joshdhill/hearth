name: Fireplace candidates
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/fetch_candidates.sh', '.github/workflows/media-candidates.yml' ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Fetch and preview candidates
        env:
          IDS: "13270910 11353677 7330824 6611724 6507518 5984963 4231468"
        run: ./tools/fetch_candidates.sh
      - name: Save previews to the media-work branch
        run: |
          git config user.name "hearth-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/prev && cp -r media-candidates /tmp/prev/
          git fetch origin media-work || true
          git checkout -B media-work
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/prev/media-candidates .
          git add media-candidates && git commit -qm "Fireplace candidate previews" && git push -f origin media-work
