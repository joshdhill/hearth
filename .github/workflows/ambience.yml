name: Build fire ambience
on:
  workflow_dispatch:
  push:
    paths: [ '.github/workflows/ambience.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Seamless fireplace recording (CC0, "Fireplace sound loop" by PagDev on OpenGameArt)
        run: |
          mkdir -p out
          curl -sL -o fire.wav https://opengameart.org/sites/default/files/fire.wav
          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate:format=duration -of compact fire.wav | tee out/ambience-report.txt
          L=$(ffprobe -v error -show_entries format=duration -of csv=p=0 fire.wav); D=3
          ffmpeg -v error -y -ss $D -i fire.wav -c:a pcm_f32le a.wav
          ffmpeg -v error -y -t $D -i fire.wav -c:a pcm_f32le b.wav
          ffmpeg -v warning -y -i a.wav -i b.wav -filter_complex "[0:a][1:a]acrossfade=d=$D:c1=qsin:c2=qsin,loudnorm=I=-24:TP=-3,aresample=44100[o]" -map "[o]" -c:a aac -b:a 160k out/fire-ambience.m4a 2>> out/ambience-report.txt
          ffprobe -v error -show_entries format=duration -of csv=p=0 out/fire-ambience.m4a | sed 's/^/loop length /' >> out/ambience-report.txt
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: media-v1
          files: |
            out/fire-ambience.m4a
            out/ambience-report.txt
          fail_on_unmatched_files: false
