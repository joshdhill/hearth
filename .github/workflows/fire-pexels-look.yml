name: Fire pexels look (search sheets + fetch)
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/fire/pexels_look.py', '.github/workflows/fire-pexels-look.yml' ]
permissions:
  contents: write
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null && pip install -q pillow playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Look and fetch
        env:
          # straight-on views of a whole firebox, logs on a grate
          QUERIES: ''
          GET: '5968832 4060537'
        run: python3 tools/fire/pexels_look.py pxl
      - name: Clips to the media-v2 release
        if: hashFiles('pxl/pexels-*.mp4') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: media-v2
          files: pxl/pexels-*.mp4
      - name: Sheets and stills to the media-work branch
        if: always()
        run: |
          rm -f pxl/pexels-*.mp4
          git config user.name "hearth-bot"; git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            rm -rf /tmp/mw; git fetch -q origin media-work && git worktree add -q -f /tmp/mw origin/media-work
            rm -rf /tmp/mw/pxlook && cp -r pxl /tmp/mw/pxlook
            (cd /tmp/mw && git add -A pxlook && git commit -qm "Pexels look sheets" && git push -q origin HEAD:media-work) && break
            git worktree remove -f /tmp/mw; sleep $((try * 9))
          done
