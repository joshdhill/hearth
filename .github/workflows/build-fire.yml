name: Build long fire loops
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/fire/build_long.py', 'tools/fire/fires.txt', 'tools/fire/mode', '.github/workflows/build-fire.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        fire: [ 1, 2, 3, 4 ]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q opencv-python-headless numpy playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Pick this job's clip
        id: pick
        run: |
          line=$(grep -v '^#' tools/fire/fires.txt | grep . | sed -n "${{ matrix.fire }}p")
          echo "mode=$(cat tools/fire/mode 2>/dev/null || echo build)" >> $GITHUB_OUTPUT
          echo "name=$(echo "$line" | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "url=$(echo "$line" | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "tv=$(echo "$line" | awk '{print $3}')" >> $GITHUB_OUTPUT
          echo "web=$(echo "$line" | awk '{print $4}')" >> $GITHUB_OUTPUT
      - name: Download
        if: steps.pick.outputs.url != ''
        run: |
          mkdir -p dl
          url="${{ steps.pick.outputs.url }}"
          case "$url" in
            *pixabay.com/videos/*) python3 tools/fire/resolve_pixabay.py dl "$url"; mv dl/pixabay-*.mp4 dl/src.mp4 ;;
            *) curl -sL --max-time 600 -o dl/src.mp4 "$url" ;;
          esac
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt:format=duration -of compact dl/src.mp4
      - name: Similarity data only (for planning)
        if: steps.pick.outputs.url != '' && steps.pick.outputs.mode == 'analyze'
        run: |
          D_ONLY=1 python3 tools/fire/build_long.py dl/src.mp4 "${{ steps.pick.outputs.name }}" 0 0 out
          git config user.name "hearth-bot"; git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3 4 5 6; do
            rm -rf /tmp/mw; git fetch -q origin media-work && git worktree add -q -f /tmp/mw origin/media-work
            mkdir -p /tmp/mw/plans && cp out/*-D.npz /tmp/mw/plans/
            (cd /tmp/mw && git add plans && git commit -qm "Similarity data: ${{ steps.pick.outputs.name }}" && git push -q origin HEAD:media-work) && break
            git worktree remove -f /tmp/mw; sleep $((try * 9))
          done
      - name: Build the long loop
        if: steps.pick.outputs.url != '' && steps.pick.outputs.mode != 'analyze'
        run: python3 tools/fire/build_long.py dl/src.mp4 "${{ steps.pick.outputs.name }}" "${{ steps.pick.outputs.tv }}" "${{ steps.pick.outputs.web }}" out
      - name: Check the finished loops (cuts, seam, how soon footage repeats)
        if: steps.pick.outputs.url != '' && steps.pick.outputs.mode != 'analyze'
        run: |
          n="${{ steps.pick.outputs.name }}"
          python3 tools/fire/check_video.py "out/$n-4k.mp4" "out/$n-web/index.m3u8" | tee "out/$n-check.txt"
      - name: Publish the 4K file for the TV
        if: steps.pick.outputs.url != '' && steps.pick.outputs.mode != 'analyze'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: media-v2
          name: Fireplace media (long loops)
          body: Long seamless fireplace loops, spliced from free Pexels/Pixabay footage. 4K 10-bit HEVC for the TV app.
          files: |
            out/*-4k.mp4
            out/*-joins.jpg
            out/*-check.txt
            out/*.json
      - name: Add the web version to the site
        if: steps.pick.outputs.url != '' && steps.pick.outputs.mode != 'analyze'
        run: |
          n="${{ steps.pick.outputs.name }}"
          git config user.name "hearth-bot"; git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p docs/media/fire
            rm -rf "docs/media/fire/$n"; cp -r "out/$n-web" "docs/media/fire/$n"; cp "out/$n-poster.jpg" "docs/media/fire/$n/poster.jpg"
            git add docs/media/fire && git commit -qm "Fire loop for the web: $n" && git push -q origin HEAD:main && break
            sleep $((try * 7))
          done
