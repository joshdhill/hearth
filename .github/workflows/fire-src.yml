name: Fire source (fetch an original clip for planning)
on:
  workflow_dispatch:
  push:
    paths: [ '.github/workflows/fire-src.yml' ]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q opencv-python-headless numpy playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Download the firebox clip as filmed (Pixabay 44699)
        run: |
          mkdir -p dl && python3 tools/fire/resolve_pixabay.py dl "https://pixabay.com/videos/fire-fireplace-flame-burn-hot-44699/"
          mv dl/pixabay-*.mp4 dl/firebox-src.mp4 && ffprobe -v error -show_entries stream=width,height:format=duration -of compact dl/firebox-src.mp4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: media-v2
          files: dl/firebox-src.mp4
