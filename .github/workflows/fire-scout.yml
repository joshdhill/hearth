name: Fire scout (long unique 4K clips)
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/fire/scout_pixabay.py', '.github/workflows/fire-scout.yml' ]
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q opencv-python-headless numpy playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Scout
        run: python3 tools/fire/scout_pixabay.py scout
      - name: Save to the media-work branch
        if: always()
        run: |
          git config user.name "hearth-bot"; git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            rm -rf /tmp/mw; git fetch -q origin media-work && git worktree add -q -f /tmp/mw origin/media-work
            rm -rf /tmp/mw/scout && cp -r scout /tmp/mw/scout
            (cd /tmp/mw && git add -A scout && git commit -qm "Fire scout results" && git push -q origin HEAD:media-work) && break
            git worktree remove -f /tmp/mw; sleep $((try * 9))
          done
