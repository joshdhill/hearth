name: Build fireplace media
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/build_media.sh', '.github/workflows/media.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Brick hearth (4K 60fps)
        run: ./tools/build_media.sh https://videos.pexels.com/video-files/13270910/13270910-uhd_3840_2160_60fps.mp4 fire-brick 1.4
      - name: Teepee fire (4K 30fps)
        if: always()
        run: ./tools/build_media.sh https://videos.pexels.com/video-files/11353677/11353677-uhd_3840_2160_30fps.mp4 fire-teepee 2.0
      - name: Publish as the media-v1 release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: media-v1
          name: Fireplace media
          body: Seamless fireplace loops built from Pexels footage (free license). Used by the Hearth TV app.
          files: |
            out/*.mp4
            out/*.jpg
            out/*.png
            out/report.txt
          fail_on_unmatched_files: false
