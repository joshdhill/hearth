name: Build TV app
on:
  workflow_dispatch:
  push:
    paths: [ 'android/**', '.github/workflows/android.yml' ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/hearth.apk 2>/dev/null || true
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 android/build.log > out/build-errors.txt 2>/dev/null || true
          [ -s out/build-errors.txt ] || rm -f out/build-errors.txt
          ls -la out
      - name: Publish the app release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Hearth for Google TV
          body: |
            Install hearth.apk on the Google TV Streamer. Build ${{ github.run_number }}.
          files: |
            out/hearth.apk
            out/build-errors.txt
          fail_on_unmatched_files: false
          make_latest: false
