name: Art probe (which free image tools work from here)
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/art/probe.py', '.github/workflows/art-probe.yml' ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests gradio_client
      - run: python3 tools/art/probe.py probe
      - name: Save to the media-work branch
        if: always()
        run: |
          git config user.name "hearth-bot"; git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            rm -rf /tmp/mw; git fetch -q origin media-work && git worktree add -q -f /tmp/mw origin/media-work
            rm -rf /tmp/mw/probe && cp -r probe /tmp/mw/probe
            (cd /tmp/mw && git add -A probe && git commit -qm "Art probe results" && git push -q origin HEAD:media-work) && break
            git worktree remove -f /tmp/mw; sleep $((try * 9))
          done
