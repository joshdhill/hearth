name: Fire candidates (long 4K)
on:
  workflow_dispatch:
  push:
    paths: [ 'tools/fire/candidates.sh', 'tools/fire/analyze.py', 'tools/fire/resolve_pixabay.py', '.github/workflows/fire-candidates.yml' ]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q opencv-python-headless numpy playwright && python -m playwright install --with-deps chromium >/dev/null
      - name: Scan
        env:
          PIXABAY: >-
            https://pixabay.com/videos/roaring-fireplace-fireplace-334256/
            https://pixabay.com/videos/fire-fireplace-bonfire-burning-236567/
            https://pixabay.com/videos/fire-fireplace-burning-crackling-234515/
            https://pixabay.com/videos/fire-fireplace-campfire-bonfire-234516/
            https://pixabay.com/videos/fire-fireplace-bonfire-campfire-262228/
            https://pixabay.com/videos/fireplace-fire-campfire-bonfire-306771/
            https://pixabay.com/videos/fire-fireplace-campfire-bonfire-239514/
            https://pixabay.com/videos/fire-fireplace-campfire-bonfire-262032/
            https://pixabay.com/videos/fire-flame-wood-fireplace-oven-123069/
            https://pixabay.com/videos/flare-up-warmth-chimney-hot-15178/
            https://pixabay.com/videos/fireplace-home-house-firewood-cozy-275774/
          PEXELS: >-
            0|none
        run: ./tools/fire/candidates.sh
      - name: Save to the media-work branch
        if: always()
        run: |
          git config user.name "hearth-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/keep && cp -r cand /tmp/keep/
          git fetch origin media-work && git checkout -B media-work origin/media-work || git checkout -B media-work
          git rm -rq . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/keep/cand candidates2
          git add candidates2 && git commit -qm "Long 4K fire candidates" && git push -f origin media-work
