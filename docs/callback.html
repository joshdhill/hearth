<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting Spotify</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #1d1e1f; color: #ece5d8; font: 400 2.2vw/1.4 'Atkinson Hyperlegible', sans-serif; }
  h1 { font: 400 3.2vw 'Young Serif', serif; margin: 0 0 .4em; }
  main { max-width: 60ch; padding: 0 6vw; }
</style>
</head>
<body>
<main><h1>Connecting Spotify</h1><p id="msg">One moment…</p></main>
<script type="module">
  import { finishLogin } from './js/spotify.js';
  const q = new URLSearchParams(location.search);
  const msg = document.getElementById('msg');
  if (q.get('error')) {
    msg.textContent = 'Spotify sign-in was cancelled. Taking you back to Hearth…';
    setTimeout(() => location.replace('./'), 2500);
  } else {
    finishLogin(q.get('code'))
      .then(back => { msg.textContent = 'Connected. Taking you back to Hearth…'; location.replace(back || './'); })
      .catch(e => { msg.textContent = 'Spotify sign-in didn’t finish: ' + e.message + '. Taking you back to Hearth…'; setTimeout(() => location.replace('./'), 4000); });
  }
</script>
</body>
</html>
